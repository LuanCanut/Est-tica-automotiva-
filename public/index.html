<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estética Automotiva</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      line-height: 1.5;
    }

    header {
      background: #000;
      padding: 20px;
      text-align: center;
      border-bottom: 2px solid #333;
    }

    header h1 {
      font-size: 28px;
    }

    header p {
      color: #ccc;
      margin-top: 5px;
    }

    .hero {
      text-align: center;
      padding: 50px 20px;
      background: linear-gradient(135deg, #111, #222);
    }

    .hero h2 {
      font-size: 34px;
      margin-bottom: 10px;
    }

    .hero p {
      color: #ccc;
      font-size: 18px;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 30px 20px;
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
    }

    .tabs {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 25px;
    }

    .tabs button {
      border: none;
      padding: 12px 25px;
      border-radius: 8px;
      background: #333;
      color: white;
      cursor: pointer;
      font-size: 16px;
    }

    .tabs button.active {
      background: #fff;
      color: #000;
    }

    .services {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 15px;
    }

    .service {
      background: #1d1d1d;
      padding: 22px;
      border-radius: 12px;
      border: 1px solid #333;
    }

    .service h3 {
      margin-bottom: 10px;
    }

    .price {
      font-size: 28px;
      font-weight: bold;
      margin-top: 15px;
    }

    .service p {
      color: #ccc;
    }

    .booking {
      margin-top: 40px;
      background: #1b1b1b;
      padding: 25px;
      border-radius: 12px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
    }

    input, select {
      width: 100%;
      padding: 13px;
      border-radius: 7px;
      border: 1px solid #444;
      background: #111;
      color: white;
      font-size: 16px;
    }

    .submit {
      width: 100%;
      margin-top: 20px;
      padding: 15px;
      border: none;
      border-radius: 8px;
      background: white;
      color: black;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .payment {
      margin-top: 30px;
      padding: 25px;
      background: #1b1b1b;
      border-radius: 12px;
      text-align: center;
    }

    .payment strong {
      font-size: 20px;
    }

    .whatsapp {
      display: inline-block;
      margin-top: 15px;
      padding: 12px 20px;
      border-radius: 8px;
      background: #25d366;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    .faq {
      margin-top: 30px;
    }

    .faq details {
      background: #1b1b1b;
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 8px;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #aaa;
      background: #000;
      margin-top: 40px;
    }
  </style>
</head>

<body>

<header>
  <h1>Estética Automotiva</h1>
  <p>Seu veículo limpo, protegido e brilhando.</p>
</header>

<section class="hero">
  <h2>Carro ou moto, sai daqui brilhando.</h2>
  <p>Escolha seu serviço e faça seu agendamento.</p>
</section>

<main class="container">

  <h2>Nossos serviços</h2>

  <div class="tabs">
    <button id="carroBtn" class="active" onclick="mostrarServicos('carro')">
      🚗 Carro
    </button>

    <button id="motoBtn" onclick="mostrarServicos('moto')">
      🏍️ Moto
    </button>
  </div>

  <div id="servicosCarro" class="services">

    <div class="service">
      <h3>Lavagem Simples</h3>
      <p>Lavagem externa do veículo.</p>
      <div class="price">R$ 60</div>
    </div>

    <div class="service">
      <h3>Lavagem Média</h3>
      <p>Lavagem com acabamento e enceramento.</p>
      <div class="price">
